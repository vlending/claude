# Microsoft GraphRAG 설정 파일

# LLM 설정
llm:
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-5-20250929
  max_tokens: 8000
  temperature: 0.0
  request_timeout: 180.0
  api_base: https://api.anthropic.com
  api_version: "2023-06-01"
  deployment_name: null
  max_retries: 3
  max_retry_wait: 10.0

# 임베딩 설정 (GraphRAG는 기본적으로 OpenAI 임베딩 사용)
# Claude는 임베딩 미제공이므로 OpenAI/Cohere/로컬 모델 사용 필요
embeddings:
  # 옵션 1: OpenAI (권장)
  api_key: ${OPENAI_API_KEY}
  model: text-embedding-3-small
  # 옵션 2: Sentence Transformers (로컬)
  # model: sentence-transformers/all-MiniLM-L6-v2
  # use_local: true

# 청크 설정
chunks:
  size: 1200
  overlap: 100
  group_by_columns: ["source_title"]

# 엔티티 추출 설정 (이미 우리가 추출했으므로 비활성화 가능)
entity_extraction:
  enabled: false  # 외부(Claude)에서 이미 추출했으므로 false
  entity_types:
    - IdolGroup
    - Member
    - Agency
    - Content
  max_gleanings: 1

# 커뮤니티 탐지 설정
community_detection:
  algorithm: leiden
  max_cluster_size: 10
  use_lcc: true  # Largest Connected Component만 사용
  seed: 42

# 커뮤니티 요약 설정
community_reports:
  max_length: 2000
  max_input_length: 8000

# 벡터 저장소 설정
vector_store:
  type: lancedb  # GraphRAG 기본 (또는 qdrant, milvus)
  db_uri: ./data/graphrag/lancedb

# 그래프 저장소 설정
graph_store:
  type: memory  # 또는 neo4j (연동 시)

# 입력 설정
input:
  type: file
  file_type: text
  base_dir: ./data/raw
  file_pattern: ".*\\.txt$"
  encoding: utf-8

# 출력 설정
output:
  base_dir: ./data/graphrag/output

# 캐시 설정
cache:
  type: file
  base_dir: ./data/graphrag/cache

# 로깅 설정
reporting:
  type: file
  base_dir: ./data/graphrag/reports

# 병렬 처리 설정
parallelization:
  stagger: 0.3  # API 요청 간격 (초)
  num_threads: 4

# 로컬 검색 설정
local_search:
  text_unit_prop: 0.5
  community_prop: 0.1
  conversation_history_max_turns: 5
  top_k_entities: 10
  top_k_relationships: 10
  max_tokens: 8000

# 글로벌 검색 설정
global_search:
  max_tokens: 8000
  data_max_tokens: 8000
  map_max_tokens: 2000
  reduce_max_tokens: 4000
  concurrency: 4

# K-POP 전용 커뮤니티 전략
custom_community_strategies:
  - name: group_centric
    description: "그룹 중심 커뮤니티 (그룹 + 멤버 + 활동)"
    seed_entities:
      - IdolGroup
    include_relationships:
      - MEMBER_OF
      - HAS_ACTIVITY
      - MANAGED_BY
    max_hops: 2

  - name: agency_centric
    description: "기획사 중심 커뮤니티 (기획사 + 그룹 + 주요 활동)"
    seed_entities:
      - Agency
    include_relationships:
      - MANAGED_BY
      - HAS_ACTIVITY
    max_hops: 2

# 프롬프트 템플릿 (커스터마이징)
prompts:
  entity_extraction: |
    (이미 외부에서 추출했으므로 사용 안 함)

  community_summary: |
    다음은 K-POP 그룹/기획사와 관련된 엔티티 및 관계 정보입니다.

    {entity_list}
    {relationship_list}

    위 정보를 바탕으로 아래 구조로 상세한 요약을 작성하세요:

    ## 개요
    - 핵심 엔티티 (그룹/기획사/멤버)

    ## 주요 활동 (시간순)
    ### 음반 활동
    ### 방송/예능 활동
    ### 수상 내역
    ### 기타 활동

    ## 멤버 개인 활동 (해당 시)

    ## 특이사항
    - 소속 변경, 멤버 변동 등

    요약은 사실 관계만 포함하며, 한국어로 작성합니다.

  local_search: |
    아래는 K-POP 관련 지식 그래프에서 추출한 정보입니다.

    {context_data}

    사용자 질문: {query}

    위 정보를 바탕으로 정확하고 상세하게 답변하세요.
    답변은 한국어로 작성하며, 구체적인 날짜/이름/활동 내역을 포함합니다.

  global_search: |
    아래는 여러 커뮤니티의 요약 정보입니다.

    {community_summaries}

    사용자 질문: {query}

    여러 커뮤니티의 정보를 종합하여 포괄적으로 답변하세요.
    한국어로 작성하며, 비교/대조가 필요한 경우 명확히 구분하여 설명합니다.
